[package]
name = "enumo"
version = "0.1.0"
authors = [
  "Max Willsey <me@mwillsey.com>",
  "Chandrakana Nandi <cnandi@cs.washington.edu>",
]
edition = "2024"

[dependencies]
clap = { version = "3.0.7", features = ["derive"] }
log = "0.4"
env_logger = { version = "0.7", default-features = false }
rand_pcg = "0.9"
rand = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "1"
num = "0.3"
num-bigint = { version = "0.3", features = ["rand"] }
ordered-float = "2.0.0"
libm = "0.2.1"
float-cmp = "0.8.0"
lazy_static = "1.4.0"
itertools = "0.9.0"
# fixed = "1.9.0"
# z3 = "0.10.0"
z3 = { version = "0.10.0", features = ["static-link-z3"] }
rustc-hash = "1"
symbolic_expressions = "5"
rayon = "1"
smallstr = "0.3"
egg = { git = "https://github.com/isamore-group/egg", branch = "main", features = [
  "serde-1",
  "lp",
] }

# Tests do a lot of work
[profile.test]
opt-level = 3
